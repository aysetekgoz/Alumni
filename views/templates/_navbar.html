<style>
    .sn-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 0.85rem 2rem;
        min-height: 70px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 2px solid #006847;
        position: sticky;
        top: 0;
        z-index: 50;
        font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .sn-logo {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 1.08rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #004d34;
        text-decoration: none;
    }
    .sn-logo-badge {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #006847 0%, #008457 100%);
        border: 2px solid #ffc72c;
        color: #ffc72c;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sn-logo:hover .sn-logo-badge {
        transform: rotate(-4deg) scale(1.05);
    }
    .sn-links {
        display: flex;
        gap: 0.3rem;
        align-items: center;
        flex-wrap: wrap;
    }
    .sn-links a {
        padding: 0.5rem 0.95rem;
        border-radius: 10000px;
        font-size: 14px;
        font-weight: 500;
        color: #36493f;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }
    .sn-links a:hover {
        color: #006847;
        background: #e6f4ef;
    }
    .sn-links a.active {
        color: #004d34;
        background: #ffc72c;
        font-weight: 700;
    }
    .sn-links a.sn-docs {
        background: linear-gradient(135deg, #006847 0%, #008457 100%);
        color: #ffffff;
        border: 1px solid #006847;
        border-radius: 10000px;
        padding: 0.52rem 1.15rem;
        font-size: 14px;
        font-weight: 600;
        margin-left: 0.45rem;
        transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 180ms ease;
    }
    .sn-links a.sn-docs:hover {
        background: #004d34;
        color: #ffc72c;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 104, 71, 0.25);
    }
    @media (max-width: 768px) {
        .sn-header { padding: 0.85rem 1rem; }
    }
</style>
{% set path = request.url.path if request else '' %}
<header class="sn-header">
    <a href="/" class="sn-logo">
        <span class="sn-logo-badge">İÜ</span>
        <span>İÜ YBS Alumni</span>
    </a>
    <nav class="sn-links" aria-label="Ana Navigasyon">
        <a href="/" class="{{ 'active' if path == '/' }}">Ana Sayfa</a>
        <a href="/users" class="{{ 'active' if path.startswith('/users') }}">Mezunlar</a>
        <a href="/announcements" class="{{ 'active' if path.startswith('/announcements') }}">Duyurular</a>
        <a href="/jobs" class="{{ 'active' if path.startswith('/jobs') }}">İş İlanları</a>
        <a href="/applications" class="{{ 'active' if path.startswith('/applications') }}">Başvurular</a>
        <a href="/about" class="{{ 'active' if path.startswith('/about') }}">Hakkında</a>
        <a href="/api/swagger" target="_blank" class="sn-docs">Swagger UI ↗</a>
    </nav>
</header>
