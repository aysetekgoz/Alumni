<style>
    .sn-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 0.9rem 2rem;
        min-height: 68px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid #e2e8e4;
        position: sticky;
        top: 0;
        z-index: 50;
        font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .sn-logo {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f3d2e;
        text-decoration: none;
    }
    .sn-logo-dot {
        width: 11px;
        height: 11px;
        border-radius: 10000px;
        background: #eab308;
        border: 2px solid #0f3d2e;
        flex-shrink: 0;
    }
    .sn-links {
        display: flex;
        gap: 0.25rem;
        align-items: center;
        flex-wrap: wrap;
    }
    .sn-links a {
        padding: 0.5rem 0.9rem;
        border-radius: 10000px;
        font-size: 14px;
        font-weight: 500;
        color: #3f4a44;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease;
    }
    .sn-links a:hover {
        color: #0f3d2e;
        background: #ecfdf5;
    }
    .sn-links a.active {
        color: #0f3d2e;
        background: #fef9c3;
        font-weight: 600;
    }
    .sn-links a.sn-docs {
        background: #0f3d2e;
        color: #fef9c3;
        border-radius: 10000px;
        padding: 0.55rem 1.15rem;
        font-size: 14px;
        font-weight: 500;
        margin-left: 0.5rem;
        transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), background 160ms ease;
    }
    .sn-links a.sn-docs:hover {
        background: #14532d;
        color: #ffffff;
        transform: translateY(-1px);
    }
    @media (max-width: 768px) {
        .sn-header { padding: 0.85rem 1rem; }
    }
</style>
{% set path = request.url.path if request else '' %}
<header class="sn-header">
    <a href="/" class="sn-logo">
        <span class="sn-logo-dot"></span>
        <span>İÜ YBS Alumni</span>
    </a>
    <nav class="sn-links" aria-label="Ana Navigasyon">
        <a href="/" class="{{ 'active' if path == '/' }}">Ana Sayfa</a>
        <a href="/users" class="{{ 'active' if path.startswith('/users') }}">Mezunlar</a>
        <a href="/announcements" class="{{ 'active' if path.startswith('/announcements') }}">Duyurular</a>
        <a href="/jobs" class="{{ 'active' if path.startswith('/jobs') }}">İş İlanları</a>
        <a href="/applications" class="{{ 'active' if path.startswith('/applications') }}">Başvurular</a>
        <a href="/about" class="{{ 'active' if path.startswith('/about') }}">Hakkında</a>
        <a href="/api/swagger" target="_blank" class="sn-docs">Swagger UI ↗</a>
    </nav>
</header>
