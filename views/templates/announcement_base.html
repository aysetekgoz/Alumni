<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Duyuru Yönetim Paneli{% endblock %} - Alumni Tracking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 2rem;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky; top: 0; z-index: 20;
        }
        .logo { font-size: 1.2rem; font-weight: 700; color: #fff; text-decoration: none; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: #fff; }
        .nav-btn-docs { background: rgba(255,255,255,0.1); color: #fff !important; padding: 0.4rem 0.9rem; border-radius: 8px; border: 1px solid var(--card-border); }
        .container { max-width: 1080px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }

        .header-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 2rem; margin-bottom: 2rem;
            backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .header-card h1 { font-size: 2rem; margin-bottom: 0.35rem; color: #fff; }
        .header-card p { color: var(--text-muted); font-size: 0.95rem; }
        .stats-badge {
            background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.4);
            padding: 0.6rem 1.2rem; border-radius: 12px; color: #a5b4fc; font-weight: 700; font-size: 0.95rem;
        }

        .crud-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        .form-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 1.75rem; backdrop-filter: blur(12px);
        }
        .form-card h2 { font-size: 1.25rem; margin-bottom: 1.25rem; color: #fff; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group textarea {
            padding: 0.75rem 0.9rem; background: rgba(15,23,42,0.6);
            border: 1px solid var(--card-border); border-radius: 8px; color: #fff;
            font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s; resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
        .btn-submit {
            padding: 0.8rem 1.6rem; background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,70,229,0.4); }

        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem; }
        .list-header h2 { font-size: 1.25rem; color: #fff; }
        .search-input {
            padding: 0.55rem 1rem; background: rgba(15,23,42,0.6); border: 1px solid var(--card-border);
            border-radius: 8px; color: #fff; font-family: inherit; font-size: 0.9rem; min-width: 240px; outline: none;
        }
        .search-input:focus { border-color: var(--accent); }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.25rem; }
        .item-card {
            background: rgba(15,23,42,0.6); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 1.4rem; display: flex; flex-direction: column;
            justify-content: space-between; transition: transform 0.2s, border-color 0.2s;
        }
        .item-card:hover { transform: translateY(-3px); border-color: rgba(99,102,241,0.5); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; gap: 0.5rem; }
        .item-title { font-size: 1.15rem; font-weight: 700; color: #fff; text-decoration: none; word-break: break-word; }
        .item-title:hover { color: var(--accent); }
        .id-badge { background: rgba(255,255,255,0.1); color: var(--accent); padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
        .item-badge { display: inline-block; background: rgba(99,102,241,0.2); color: #a5b4fc; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.75rem; }
        .item-info { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.35rem; word-break: break-word; }

        .item-actions { display: flex; gap: 0.6rem; margin-top: 1.25rem; padding-top: 0.9rem; border-top: 1px solid rgba(255,255,255,0.08); }
        .btn-action {
            flex: 1; padding: 0.55rem 0.75rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
            border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 0.35rem; transition: all 0.2s; text-decoration: none; font-family: inherit;
        }
        .btn-edit { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }
        .btn-edit:hover { background: rgba(56,189,248,0.25); transform: translateY(-1px); }
        .btn-delete { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .btn-delete:hover { background: rgba(239,68,68,0.25); transform: translateY(-1px); }

        .empty-state { text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 12px; color: var(--text-muted); border: 1px dashed var(--card-border); }
        .detail-content { white-space: pre-wrap; line-height: 1.7; color: #e2e8f0; margin: 1rem 0 1.5rem; word-break: break-word; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #0f172a; border: 1px solid var(--card-border); border-radius: 18px; max-width: 500px; width: 100%; padding: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--card-border); }
        .modal-header h3 { font-size: 1.25rem; color: #fff; }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .btn-close:hover { color: #fff; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; }
        .btn-cancel { background: rgba(255,255,255,0.08); color: #fff; padding: 0.65rem 1.2rem; border-radius: 8px; border: 1px solid var(--card-border); font-weight: 600; cursor: pointer; text-decoration: none; font-family: inherit; }
        .btn-cancel:hover { background: rgba(255,255,255,0.15); }

        footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--card-border); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">🎓 Alumni Tracking System</a>
        <div class="nav-links">
            <a href="/">Ana Sayfa</a>
            <a href="/about">Hakkında</a>
            <a href="/users">Mezunlar (Web CRUD)</a>
            <a href="/announcements" style="color:#fff;font-weight:700;">Duyurular</a>
            <a href="/api/swagger" target="_blank" class="nav-btn-docs">Swagger UI ↗</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>İstanbul Üniversitesi • Web Programlama • Alumni Tracking System</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
